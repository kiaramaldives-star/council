:root{--gold:#C8102E;--navy:#6B0F1A;--bg:#F6F7F9;--line:#E7E9EE;--muted:#6B7280}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);font-family:"Faruma","Segoe UI",system-ui,sans-serif;color:#111827;font-size:16px}
h1,h2,h3,.hd{font-family:"KondeyHeading","Faruma",sans-serif;font-weight:400}
.en{font-family:system-ui,"Segoe UI",sans-serif;font-size:.78em;color:var(--muted);direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit}
.ltr,input[type=email],input[type=password],input[type=url],input[type=number],input[type=date],input[type=datetime-local]{direction:ltr;text-align:left;font-family:system-ui,"Segoe UI",sans-serif}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{background:#fff;border-radius:22px;padding:34px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(5,0,0,.08);text-align:center}
.lcard img{width:82px}
.lcard h1{color:var(--navy);font-size:26px;margin:10px 0 4px}
.lcard p{color:var(--muted);margin:0 0 20px}
.fld{display:flex;flex-direction:column;gap:6px;text-align:right;margin-bottom:14px}
.fld label{font-size:14px;color:#374151}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #FDE3E7}
.fld textarea{min-height:120px;resize:vertical;line-height:1.8}
.btn{border:0;border-radius:12px;padding:11px 20px;cursor:pointer;background:var(--gold);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(.93)}
.btn.ghost{background:#F3F4F6;color:#374151}
.btn.danger{background:#FEE2E2;color:#B91C1C}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.wide{width:100%}
.msg{margin-top:12px;font-size:14px;min-height:20px}
.msg.err{color:#B91C1C}.msg.ok{color:#15803D}
.linkbtn{background:none;border:0;color:var(--gold);cursor:pointer;margin-top:10px;font-size:14px}
/* app */
.top{background:var(--gold);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 22px;position:sticky;top:0;z-index:10}
.top img{width:40px;background:#fff;border-radius:10px;padding:3px}
.top h1{font-size:21px;margin:0;flex:1}
.top .who{font-size:13px;opacity:.9;direction:ltr}
.top .btn{background:rgba(255,255,255,.18)}
.wrap{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:22px;max-width:1400px;margin:0 auto}
.side{background:#fff;border-radius:18px;padding:10px;height:max-content;position:sticky;top:86px}
.side button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:right}
.side button:hover{background:#F7F7F9}
.side button.on{background:#FDF2F4;color:var(--gold)}
.side b{font-family:system-ui;font-size:12px;background:#F3F4F6;color:#374151;border-radius:999px;padding:2px 8px}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.main{min-width:0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0;color:var(--navy);font-size:26px;flex:1}
.search{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;min-width:220px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;border:1px solid transparent}
.row:hover{border-color:var(--line)}
.row .th{width:58px;height:42px;border-radius:8px;object-fit:cover;background:#F3F4F6;flex:none}
.row .tt{flex:1;min-width:0}
.row .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt small{color:var(--muted);font-family:system-ui;font-size:12px}
.row .hid{background:#FEF3C7;color:#92400E;font-size:12px;border-radius:6px;padding:2px 7px;margin-inline-start:6px}
.row .acts{display:flex;gap:6px;flex:none}
.empty{background:#fff;border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
/* editor */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;justify-content:flex-start;z-index:20}
.ov[hidden]{display:none}
.ed{background:#fff;width:min(640px,100%);height:100%;overflow:auto;padding:24px 24px 0;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.ed h3{color:var(--navy);font-size:23px;margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.imgbox{display:flex;align-items:center;gap:12px}
.imgbox img{width:110px;height:76px;object-fit:cover;border-radius:10px;background:#F3F4F6}
.filebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filebox a{font-size:13px;direction:ltr;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 16px}
.edfoot{position:sticky;bottom:0;margin:0 -24px;background:#fff;border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:10px}
.note{background:#FDF2F4;border-radius:14px;padding:16px 18px;margin-bottom:16px;line-height:1.8}
.note .btn{margin-top:8px}
.hint{font-size:12px;color:var(--muted);font-family:system-ui;direction:ltr;text-align:right}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}.side hr{display:none}.grid2{grid-template-columns:1fr}.row .th{display:none}}
.reqs{display:grid;gap:6px;margin-bottom:8px}.reqs .chk{display:flex;align-items:center;gap:10px;direction:rtl;text-align:right;cursor:pointer;margin:0;padding:8px 10px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px}
.reqs .chk input{width:18px;height:18px;flex:none;margin:0;accent-color:#C8102E}
.etabs{display:flex;gap:6px;flex-wrap:wrap;background:#F1F2F4;border-radius:14px;padding:5px;margin:4px 0 16px;position:sticky;top:-24px;z-index:2}
.etab{flex:1;min-width:64px;border:0;background:none;border-radius:10px;padding:9px 10px;font:inherit;font-size:15px;color:#4B5563;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.etab .en{font-size:11px;color:#9CA3AF}
.etab.on{background:#fff;color:#C8102E;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.etab .dot{position:absolute;top:8px;left:10px;width:8px;height:8px;border-radius:50%;background:#D1D5DB}
.etab .dot.ok{background:#16A34A}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.mchip{border:1px dashed #D1D5DB;background:#fff;color:#6B7280;border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.mchip.ok{border:1px solid #BBF7D0;background:#F0FDF4;color:#15803D}
.mchip:hover{border-color:#C8102E;color:#C8102E}
@media (max-width:700px){.mchips{order:3;width:100%;margin:6px 0 0}.row{flex-wrap:wrap}}
.edhead{display:flex;align-items:center;gap:10px;justify-content:space-between}.edhead h3{margin:0}
.kbtog{flex:none;border:1px solid #E5E7EB;background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;color:#6B7280;cursor:pointer}
.kbtog.on{border-color:#C8102E;color:#C8102E;background:#FFF5F6}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#F8F9FB;border:1px solid #E5E7EB;border-bottom:0;border-radius:12px 12px 0 0;padding:6px}
.tb button{border:0;background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;color:#374151;cursor:pointer;line-height:1.5}
.tb button:hover{border-color:#C8102E;color:#C8102E}
.tb button.on{background:#C8102E;border-color:#C8102E;color:#fff}
.tb-sp{flex:1}
.tb+textarea{border-top-left-radius:0!important;border-top-right-radius:0!important}
.pv{border:1px solid #E5E7EB;border-radius:0 0 12px 12px;padding:16px;min-height:200px;max-height:520px;overflow:auto;background:#fff;direction:rtl;text-align:right;font-family:"Faruma",sans-serif;line-height:1.9}
.pv h4{color:#C8102E;margin:10px 0 6px}.pv ol,.pv ul{padding-inline-start:22px}.pv-empty{color:#9CA3AF}
.tb-foot{display:flex;justify-content:flex-start;font-size:12px;color:#9CA3AF;margin-top:4px;direction:rtl}
.pv .ag-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.pv .ag-i{display:flex;gap:10px;align-items:center;background:#F8F9FB;border:1px solid #EEF0F3;border-radius:12px;padding:8px 10px}.pv .ag-i.wide{grid-column:1/-1}
.pv .ag-ic{width:30px;height:30px;border-radius:9px;background:#FDE3E7;color:#C8102E;display:grid;place-items:center;flex:none}.pv .ag-i small{display:block;color:#6B7280;font-size:12px}.pv .ag-i b{font-weight:400}
.pv .ag-h{color:#C8102E}.pv .ag-list{list-style:none;padding:0;display:grid;gap:8px}.pv .ag-list li{display:flex;align-items:center;gap:10px;border:1px solid #EEF0F3;border-radius:12px;padding:8px 10px}
.pv .ag-n{width:26px;height:26px;border-radius:8px;background:#C8102E;color:#fff;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}.pv .ag-t{flex:1}
.pv .ag-r{font-style:normal;font-size:12px;background:#EEF0F3;border-radius:999px;padding:2px 8px;color:#4B5563}.pv .ag-foot{margin-top:12px;border-top:1px dashed #E5E7EB;padding-top:8px;color:#6B7280;font-size:13px;display:flex;flex-direction:column}
@media (max-width:520px){.etab{font-size:13px;padding:8px 4px}.etab .en{font-size:10px}.etabs{gap:3px;flex-wrap:nowrap}}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal-it{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid #E5E7EB;background:#F3F4F6}
.gal-it img{width:100%;height:100%;object-fit:cover;display:block}.gal-it.new{outline:2px solid #FCD34D}
.gal-x{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(17,24,39,.75);color:#fff;font-size:12px;cursor:pointer}
.gal-add{aspect-ratio:1;border:2px dashed #D1D5DB;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#6B7280;text-align:center;background:#fff}
.gal-add span{font-size:26px;line-height:1;color:#C8102E}.gal-add small{font-size:11px;line-height:1.4}.gal-add:hover{border-color:#C8102E}
.att-all{display:flex;gap:6px;margin:8px 0}.att-all button,.att-add{border:1px solid #E5E7EB;background:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:#374151}
.att-all button:first-child{border-color:#BBF7D0;background:#F0FDF4;color:#15803D}
.att-list{display:grid;gap:8px}
.att-r{display:flex;align-items:center;gap:10px;border:1px solid #E5E7EB;border-radius:14px;padding:10px 12px;background:#fff;flex-wrap:wrap}
.att-n{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px}.att-n b{font-weight:400;font-size:16px}.att-n small{color:#6B7280;font-size:12px}
.att-in{border:1px solid #E5E7EB;border-radius:8px;padding:6px 8px;font:inherit;font-size:15px;direction:rtl}.att-in.sm{font-size:13px}
.att-s{display:flex;background:#F1F2F4;border-radius:10px;padding:3px;gap:2px}
.att-s button{border:0;background:none;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:#6B7280;cursor:pointer}
.att-s button.on.p{background:#16A34A;color:#fff}.att-s button.on.l{background:#F59E0B;color:#fff}.att-s button.on.a{background:#DC2626;color:#fff}
.att-x{border:0;background:#F3F4F6;border-radius:50%;width:28px;height:28px;cursor:pointer}
.att-add{margin-top:8px;border-style:dashed;width:100%}
</style>

let S=null; try{S=JSON.parse(localStorage.getItem("kc_admin_session")||"null")}catch(e){}
const saveS=x=>{S=x;try{x?localStorage.setItem("kc_admin_session",JSON.stringify(x)):localStorage.removeItem("kc_admin_session")}catch(e){}};
async function authCall(path,body){const r=await fetch(`${SB_URL}/auth/v1/${path}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||("Error "+r.status));return j;}
async function refresh(){if(!S?.refresh_token)throw new Error("signed out");const j=await authCall("token?grant_type=refresh_token",{refresh_token:S.refresh_token});saveS({...j,expires_at:Date.now()/1000+j.expires_in});}
async function token(){if(!S)throw new Error("signed out");if(S.expires_at&&S.expires_at-60<Date.now()/1000)await refresh();return S.access_token;}
async function api(path,opt={},retry=true){
  const r=await fetch(`${SB_URL}${path}`,{...opt,headers:{apikey:SB_KEY,Authorization:"Bearer "+await token(),...(opt.headers||{})}});
  if(r.status===401&&retry){await refresh();return api(path,opt,false);}
  if(!r.ok){const t=await r.text();throw new Error(t||("Error "+r.status));}
  const t=await r.text();return t?JSON.parse(t):null;
}
let signup=false;
$("#lMode").onclick=()=>{signup=!signup;$("#lGo").innerHTML=signup?'އެކައުންޓް ހަދާ <span class="en" style="color:#fff">Create account</span>':'ލޮގިން <span class="en" style="color:#fff">Sign in</span>';$("#lMode").innerHTML=signup?'ލޮގިން ކުރަން <span class="en">Back to sign in</span>':'އަލަށް އެކައުންޓެއް ހަދާ <span class="en">Create account</span>';$("#lMsg").textContent="";};
async function doLogin(){
  const email=$("#lEmail").value.trim(), password=$("#lPass").value; const m=$("#lMsg"); m.className="msg"; m.textContent="...";
  try{
    if(signup){const j=await authCall("signup",{email,password});
      if(j.access_token){saveS({...j,expires_at:Date.now()/1000+j.expires_in});return start();}
      m.className="msg ok";m.textContent="އީމެއިލަށް ފޮނުވި ލިންކް ފިއްތުމަށްފަހު ލޮގިން ކުރައްވާ. (Check your email to confirm, then sign in.)";signup=true;$("#lMode").click();return;}
    const j=await authCall("token?grant_type=password",{email,password}); saveS({...j,expires_at:Date.now()/1000+j.expires_in}); $("#lPass").value=""; start();
  }catch(e){m.className="msg err";m.textContent=e.message;}
}

}

    return insertAt(ta,(ta.value.trim()?"\n\n":"")+`ތަން: ކޮނޑޭ ކައުންސިލް އިދާރާ\nގަޑި: 10:00\nތާރީޚު: ${d}\nރިޔާސަތު: ނަސްރު މުޙައްމަދު ދީދީ، ކޮނޑޭ ކައުންސިލް ރައީސް\n\n# ހުށަހަޅާ މައްސަލަތައް\n1. ކުރީގެ ބައްދަލުވުމުގެ ޔައުމިއްޔާ ފާސްކުރުން. — އިދާރާއިން\n2.  — އިދާރާއިން\n3.  — އިދާރާއިން\n`);}
  if(c==="renum"){let n=0;ta.focus();ta.select();return insertAt(ta,ta.value.split("\n").map(l=>/^\s*\d+[.)]\s/.test(l)?l.replace(/^\s*\d+[.)]\s+/,(++n)+". "):(l.trim()&&!/^\s*\d/.test(l)&&!l.startsWith("  ")?(n=n,l):l)).join("\n"));}

  const body=sec.tabs?`<div class="etabs">${sec.tabs.map(([k,dv,en],i)=>`<button type="button" class="etab${k===(TAB0||"main")?" on":""}" data-tab="${k}">${dv}<span class="en">${en}</span>${k!=="main"?`<i class="dot${has(k)?" ok":""}"></i>`:""}</button>`).join("")}</div>
     ${sec.tabs.map(([k])=>`<div class="pane" data-pane="${k}" ${k===(TAB0||"main")?"":"hidden"}>${sec.fields.filter(f=>(f.tab||"main")===k).map(f=>fieldHTML(f,d[f.k])).join("")}</div>`).join("")}`
    :sec.fields.map(f=>fieldHTML(f,d[f.k])).join("");

    <label class="chk"><input type="checkbox" id="pub" ${!r||r.published?"checked":""}> ވެބްސައިޓުގައި ދައްކާ <span class="en">Show on website</span></label>
    <div class="msg" id="edMsg"></div>

  $("#ov").hidden=false;

    [...gi.files].forEach(file=>{PENDG[k].push(file);const it=document.createElement("div");it.className="gal-it new";it.dataset.pend=PENDG[k].length-1;it.innerHTML=`<img src="${URL.createObjectURL(file)}" alt=""><button type="button" class="gal-x" data-galrm>✕</button>`;gi.closest(".gal-add").before(it);});gi.value="";});
  $("#ed").addEventListener("click",e=>{const x=e.target.closest("[data-galrm]");if(!x)return;e.preventDefault();const it=x.closest(".gal-it"),box=x.closest("[data-gal]"),k=box.dataset.gal;
    if(it.dataset.pend!=null){PENDG[k][+it.dataset.pend]=null;}else{const h=box.querySelector(`[data-k="${k}"]`);h.value=JSON.stringify(JSON.parse(h.value||"[]").filter(u=>u!==it.dataset.url));}it.remove();});}
  $("#ed").onchange=e=>{const f=e.target.closest("[data-file]");if(!f||!f.files[0])return;PEND[f.dataset.file]=f.files[0];
    if(f.dataset.img){const p=$(`[data-prev="${f.dataset.file}"]`);p.src=URL.createObjectURL(f.files[0]);}};

$("#ov").onclick=e=>{if(e.target.id==="ov")$("#ov").hidden=true;};
async function shrink(file,max=1400){ // resize big photos before upload
  if(!file.type.startsWith("image/")||file.type==="image/gif") return file;
  const img=await createImageBitmap(file).catch(()=>null); if(!img) return file;
  const k=Math.min(1,max/Math.max(img.width,img.height)); if(k===1&&file.size<600e3) return file;
  const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(b=>res(new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"})),"image/jpeg",.82));
}
async function upload(file,folder){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${folder}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  await api(`/storage/v1/object/media/${path}`,{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream","x-upsert":"true"},body:file});
  return pubUrl(path);
}
async function saveEdit(){
  const sec=SECTIONS[CUR], m=$("#edMsg"); const btn=$("#save"); btn.disabled=true; m.className="msg"; m.textContent="ސޭވް ކުރަނީ… Saving…";
  try{
    const d={...(EDIT?EDIT.data:{})};
    for(const f of sec.fields){
      if(f.type==="hiddenid"){ if(!d.id) d.id=Date.now().toString(36); continue; }
      if(f.type==="hiddenfixed"){ d[f.k]=d[f.k]||f.def; continue; }
      if(f.type==="attendance"){try{d[f.k]=JSON.parse($(`#ed [data-k="${f.k}"]`)?.value||"[]")}catch(_){d[f.k]=[]}continue;}
      if(f.type==="gallery"){let L=[];try{L=JSON.parse($(`#ed [data-k="${f.k}"]`)?.value||"[]")}catch(_){}
        for(const file of (PENDG[f.k]||[]).filter(Boolean)){m.textContent=`ފޮޓޯ އަޕްލޯޑް ކުރަނީ… Uploading photos (${L.length+1})`;L.push(await upload(await shrink(file,1800),CUR));}
        d[f.k]=L;continue;}
      let v=$(`#ed [data-k="${f.k}"]`)?.value ?? "";
      if(PEND[f.k]){ const file=f.type==="image"?await shrink(PEND[f.k]):PEND[f.k]; v=await upload(file,CUR); }
      if(f.type==="number") v=v===""?null:Number(v);
      if(f.type==="datetime") v=v?v.replace("T"," ").slice(0,16):"";
      d[f.k]=v;
    }
    if(CUR==="announcements"&&!d.files) d.files=[];
    const published=$("#pub").checked;
    if(EDIT){ await api(`/rest/v1/content?id=eq.${EDIT.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:d,published})}); EDIT.data=d; EDIT.published=published; }
    else{ const min=Math.min(0,...ROWS.filter(r=>r.section===CUR).map(r=>r.position));
      const [row]=await api(`/rest/v1/content`,{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({section:CUR,data:d,position:min-1,published})});
      ROWS.unshift(row); ROWS.sort((x,y)=>x.position-y.position); }
    $("#ov").hidden=true; renderSide(); renderMain();
  }catch(e){m.className="msg err";m.textContent=e.message;}
  btn.disabled=false;
}

/* ---------- one-time import from index.html ---------- */
async function importSite(){
  const m=$("#impMsg"), btn=$("#importBtn"); btn.disabled=true; m.className="msg"; m.textContent="ވެބްސައިޓް ލޯޑު ކުރަނީ… Loading website…";
  try{
    const fr=document.createElement("iframe"); fr.style.display="none"; fr.src="index.html?nodb=1"; document.body.appendChild(fr);
    await new Promise((res,rej)=>{fr.onload=res;setTimeout(()=>rej(new Error("Could not load index.html")),60000);});
    const w=fr.contentWindow;
    const data=w.eval(`({news:NEWS,announcements:ANNOUNCEMENTS,press:PRESS,activities:ACTIVITIES,meetings:MEETINGS.map(({dv,en,...m})=>m),reports:REPORTS,rules:RULES,attendance:ATTENDANCE,awards:AWARDS,staff:STAFF,projects:PROJECTS,directory:DIRECTORY,
      island:[{total:STATS[0].n,male:STATS[1].n,female:STATS[2].n,area:(STATS.find(x=>x.icon==="map")||{}).n,updated_dv:"ސެޕްޓެމްބަރު 2023",updated_en:"September 2023"}],
      councillors:COUNCIL_TERMS.flatMap(t=>t.members.map(m=>({term:/ފުރަތަމަ/.test(t.dv)?1:parseInt(t.dv)||0,...m}))),
      wdc:WDC_TERMS.flatMap(t=>t.members.map(m=>({term:/ފުރަތަމަ/.test(t.dv)?1:parseInt(t.dv)||0,...m})))})`);
    const have=new Set(ROWS.map(r=>r.section)); const all=[]; for(const [sec,arr] of Object.entries(data)) if(!have.has(sec)) arr.forEach((x,i)=>all.push([sec,JSON.parse(JSON.stringify(x)),i]));
    let n=0;
    for(const item of all){ const [sec,d]=item;
      for(const k of ["img","photo"]) if(typeof d[k]==="string"&&d[k].startsWith("data:")){
        const blob=await (await fetch(d[k])).blob(); const ext=blob.type.split("/")[1]||"jpg";
        const path=`${sec}/import-${(d.id||Math.random().toString(36).slice(2,9))}-${k}.${ext}`;
        await api(`/storage/v1/object/media/${path}`,{method:"POST",headers:{"Content-Type":blob.type,"x-upsert":"true"},body:blob}); d[k]=pubUrl(path);
      }
      m.textContent=`ފޮޓޯ ގެންނަނީ ${++n}/${all.length} — Preparing ${n}/${all.length}`;
    }
    const rows=all.map(([section,data,position])=>({section,data,position}));
    for(let i=0;i<rows.length;i+=100){ await api(`/rest/v1/content`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rows.slice(i,i+100))}); m.textContent=`ސޭވް ކުރަނީ ${Math.min(i+100,rows.length)}/${rows.length}`; }
    fr.remove(); await loadRows(); renderSide(); renderMain();
  }catch(e){m.className="msg err";m.textContent=e.message;btn.disabled=false;}
}
