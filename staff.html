:root{--p:#C8102E;--ps:#FCE8EB;--k:#0B0B0B;--line:#E7E9EE;--muted:#6B7280;--text:#111827;--bg:#F4F4F6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Faruma","MV Faseyha",sans-serif;-webkit-text-size-adjust:100%}
.h,h1,h2,h3,button,.btn{font-family:"KondeyHeading","Faruma",sans-serif;font-weight:400}
.num,input[type=number],input[type=date]{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700}
.en{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:.78em;color:var(--muted);font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{width:46px;height:46px}.top h1{margin:0;font-size:21px;color:var(--p);flex:1;line-height:1.4}.top h1 small{display:block;font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-top:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 6px}
input{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;direction:ltr;text-align:left}
input:focus{outline:2px solid var(--p);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-size:17px;cursor:pointer;background:var(--p);color:#fff;width:100%}
.btn.ghost{background:#F3F4F6;color:var(--text)}.btn.sm{width:auto;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.5}
.msg{margin-top:10px;font-size:14px;line-height:1.7}.msg.err{color:#B91C1C}.msg.ok{color:#15803D}
.lnk{background:none;border:0;color:var(--p);cursor:pointer;font-size:15px;margin-top:12px;text-decoration:underline}
.me{display:flex;align-items:center;gap:14px}.me .ph{width:62px;height:62px;border-radius:50%;overflow:hidden;background:var(--ps);display:grid;place-items:center;color:var(--p);font-size:24px;flex:none}
.me .ph img{width:100%;height:100%;object-fit:cover;object-position:top}.me b{display:block;font-size:19px}.me small{color:var(--muted)}
.alert{display:flex;gap:12px;align-items:center;border-radius:18px;padding:14px 16px;margin-top:14px;color:#fff;background:linear-gradient(120deg,var(--p),#7A0A1C 60%,#0B0B0B)}
.alert b{display:block;font-size:18px}.alert small{opacity:.85}.alert.done{background:linear-gradient(120deg,#16A34A,#15803D)}
.cls h2{margin:0 0 4px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.cls h2 span{font-size:14px;background:var(--k);color:#fff;border-radius:99px;padding:2px 12px}

/* ===== Professional UI layer ===== */
:root{--p:#C8102E;--pd:#9E0C24;--ps:#FDECEF;--line:#E5E7EB;--muted:#6B7280;--text:#111827;--bg:#F3F4F6;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}
body{background:var(--bg)}

.topin{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto;padding:10px 16px;min-height:64px}

.tact{display:flex;gap:8px;flex:none}
.tb{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:14px;cursor:pointer;font-family:"KondeyHeading","Faruma",sans-serif}
.tb:hover{background:rgba(255,255,255,.22)}.tb .en{color:#fff!important}
.tb.lang{min-width:46px;justify-content:center;font-family:"Plus Jakarta Sans","Faruma",sans-serif!important;font-weight:700}

    const p1=`<section class="pg">${head}<table class="kv"><tr class="sh"><th colspan="2">Student Particulars</th><th class="dv">ދަރިވަރުގެ މަޢުލޫމާތު</th></tr>
      ${row("Identity Number:",esc(s.id_no||""),"އައިޑެންޓިޓީ ނަންބަރ:")}${row("Student’s Name:",esc(s.name_en)+(s.name_dv?`<br><span class="tn">${esc(s.name_dv)}</span>`:""),"ދަރިވަރުގެ ނަން:")}${row("Date of Birth:",enDate(s.dob),"އުފަން ތާރީޚު:")}
      ${row("Permanent Address:",esc(s.address_en||""),"ދާއިމީ އެޑްރެސް:")}${row("Atoll / Island",esc(s.island_en||""),"އަތޮޅު/ރަށް:")}${row("Grade:",esc(s.grade||""),"ގްރޭޑް:")}${row("Class:",esc(cls),"ކުލާސް:")}
      ${row("Term Started Date:",enDate(T.start_date),"ޓާމުގެ ކިޔެވުން ފެށުނު ތާރީޚް:")}${row("Term Ended Date:",enDate(T.end_date),"ޓާމުގެ ކިޔެވުން ނިމުނު ތާރީޚް:")}${row("School re-opening date:",enDate(T.reopen_date),"ސްކޫލު ދެން ހުޅުވޭނެ ތާރީޚް:")}</table>
      <table class="kv"><tr class="sh"><th colspan="2">Attendance</th><th class="dv">ޙާޒިރީ</th></tr>${row("No of days to be attended",esc(T.teaching_days||d.teaching_days||""),"ޙާޒިރުވާން ޖެހޭ ދުވަހުގެ އަދަދު")}${row("No of days attended",esc(d.att_days??""),"ޙާޒިރުވި ދުވަހުގެ އަދަދު")}${row("No of days absent",esc(d.absent_days??""),"ހާޟިރުނުވި ދުވަހުގެ އަދަދު")}${row("No of days excused",esc(d.excused_days??""),"ބަލިވެގެން ހާޟިރުނުވި ދުވަހުގެ އަދަދު")}${row("No of days late",esc(d.late_days??""),"ގަޑި ޖެހުނު ދުވަހުގެ އަދަދު")}</table>
      <table class="kv"><tr class="sh"><th colspan="2">Physical Development</th><th class="dv">ހެދި ބޮޑުވުން</th></tr>${row("Height (cm)",esc(d.height??""),"އިސްކޮޅު (ސ.މ)")}${row("Weight (Kg)",esc(d.weight??""),"ބަރުދަން (ކ.ގ)")}</table>
      <table class="kv"><tr class="sh"><th colspan="2">Parent</th><th class="dv">ބެލެނިވެރިޔާ</th></tr>${row("Guardian’s Name",esc(s.guardian_en||"")+(s.guardian_dv?`<br><span class="tn">${esc(s.guardian_dv)}</span>`:""),"ބެލެނިވެރިޔާގެ ނަން:")}</table>
      <div class="band">KONDEY SCHOOL, GA.KONDEY</div></section>`;
    const subRow=k=>{const s0=RSUB.find(x=>x[0]===k),fa=num(d[k+"_fa"]),ma=num(d[k+"_ma"]),a=num(d[k+"_a"]),t=(fa||0)+(ma||0)+(a||0);
      return `<tr><td class="sj"><span class="tn">${s0[1]}</span><br>${s0[2]}</td><td class="cm" dir="auto">${esc(d[k+"_comment"]||"")}</td><td>${fa??"-"}</td><td class="p">${fa==null?"-":pct(fa,t)}</td><td>${ma??"-"}</td><td class="p">${ma==null?"-":pct(ma,t)}</td><td>${a??"-"}</td><td class="p">${a==null?"-":pct(a,t)}</td><td><b>${t||"-"}</b></td></tr>`;};
    const subTab=ks=>`<table class="sb"><thead><tr><th colspan="2">މާއްދާ ޓީޗަރުގެ ބަޔާން<br>Subject teacher's feedback</th><th colspan="7">އައުޓްކަމްތަކުން ހާސިލްވި މިންވަރު<br>Outcome Status</th></tr><tr><th colspan="2"></th><th>FA<br>ފހ</th><th>%</th><th>MA<br>ބހ</th><th>%</th><th>A<br>ހ</th><th>%</th><th>Total<br>ޖުމްލަ</th></tr></thead><tbody>${ks.map(subRow).join("")}</tbody></table>`;
    const filled=k=>d[k+"_comment"]||d[k+"_fa"]||d[k+"_ma"]||d[k+"_a"];
    const p2=`<section class="pg">${head}${who}${subTab(["quran","islam","dhivehi","english","maths","hpe","social"].filter(k=>filled(k)||k!=="quran"))}${foot}</section>`;
    const lv=x=>esc(x||"");
    const p3=`<section class="pg">${head}${who}${subTab(["science","arts","business"].filter(k=>k!=="business"||filled(k)))}
      <table class="cp"><tr class="sh"><th colspan="6">Student competency levels for Numeracy and Literacy</th></tr><tr class="s2"><th colspan="6">English</th></tr><tr><th colspan="2">Reading</th><th colspan="2">Writing</th><th colspan="2">Speaking</th></tr><tr><td colspan="2">${lv(d.comp_en_r)}</td><td colspan="2">${lv(d.comp_en_w)}</td><td colspan="2">${lv(d.comp_en_s)}</td></tr>
      <tr class="s2"><th colspan="6">Dhivehi</th></tr><tr><th colspan="2">Reading</th><th colspan="2">Writing</th><th colspan="2">Speaking</th></tr><tr><td colspan="2">${lv(d.comp_dv_r)}</td><td colspan="2">${lv(d.comp_dv_w)}</td><td colspan="2">${lv(d.comp_dv_s)}</td></tr>
      <tr class="s2"><th colspan="6">Mathematics</th></tr><tr><th colspan="3">Arithmetics</th><th colspan="3">Reasoning</th></tr><tr><td colspan="3">${lv(d.comp_ma_ar)}</td><td colspan="3">${lv(d.comp_ma_re)}</td></tr></table>${foot}</section>`;
    const ex=EXTRA.filter(([k])=>d[k]);
    const p4=`<section class="pg">${head}${who}
      ${ex.length?`<table class="cp"><tr class="sh"><th colspan="2">Extra Activities · <span class="tn">އިތުރު ހަރަކާތްތައް</span></th></tr>${ex.reduce((a,x,i)=>i%2?a:a.concat([[x,ex[i+1]]]),[]).map(([a,b])=>`<tr><th>${a[1]}<br><span class="tn">${a[2]}</span></th><th>${b?`${b[1]}<br><span class="tn">${b[2]}</span>`:""}</th></tr><tr><td dir="auto">${esc(d[a[0]])}</td><td dir="auto">${b?esc(d[b[0]]):""}</td></tr>`).join("")}</table>`:""}
      <table class="cd"><tr class="sh"><th colspan="3"><span class="tn">އަޚްލާޤާއި ސުލޫކު</span> · Student Conduct</th></tr>${COND.map(([k,en,dv])=>`<tr><td>${en}</td><td class="v">${lv(d[k])}</td><td class="dv">${dv}</td></tr>`).join("")}</table>
      <div class="box"><div class="bh"><span class="tn">މައިގަނޑު ޤާބިލިއްޔަތުތަކާއި ގުޅޭ ތަފްސީލީ ބަޔާން</span><br>Additional comment on Key competencies</div><div class="bt" dir="auto">${esc(d.key_comment||"")}</div></div>
      <div class="box"><div class="bh"><span class="tn">ކުލާސް ޓީޗަރުގެ ތަފްސީލީ ބަޔާން</span><br>General Comment by the Class Teacher</div><div class="bt" dir="auto">${esc(d.general_comment||"")}</div><div class="sg"><span>Name: ${esc(ct)}</span><span>${enDate(T.report_date||T.end_date)}</span></div></div>
      <div class="sigs"><div><div class="bh"><span class="tn">ލީޑިންގް ޓީޗަރ</span><br>Leading Teacher</div><p>Name: ${esc(ld)}</p><p>Date: ${enDate(T.report_date||T.end_date)}</p><p>Signature:</p></div><div><div class="bh"><span class="tn">ސްކޫލުގެ ފަރާތުން</span><br>Head of School</div><p>Name: ${esc(T.head_of_school||"")}</p><p>Date: ${enDate(T.report_date||T.end_date)}</p><p>Signature:</p></div></div>${foot}</section>`;
    const out60=T.marks_out_of||60;
    const p5=MARKG.includes(s.grade)?`<section class="pg">${head}${who}<table class="mk"><thead><tr><th><span class="tn">މާއްދާ</span><br>Subject</th><th><span class="tn">މާއްދާތަކުން ލިބުނު މާރކްސް</span><br>Subject Marks (out of ${out60})</th><th>%</th><th>Grade</th></tr></thead><tbody>${MARKSUB.map(k=>{const s0=RSUB.find(x=>x[0]===k),m=num(d[k+"_marks"]),p=m==null?null:m/out60*100;return `<tr><td><span class="tn">${s0[1]}</span><br>${s0[2]}</td><td>${m??"-"}</td><td>${p==null?"-":Math.round(p*10)/10}</td><td><b>${gradeOf(p)}</b></td></tr>`;}).join("")}</tbody></table>
      <p class="key">A+ 85–100 · A 75–84 · B 64–74 · C 50–63 · D 40–49 · E 35–39 · F 1–34 · MC = missed / no marks</p>${foot}</section>`:"";
    return p1+p2+p3+p4+p5;}).join("");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Report cards · ${esc(C.class_en||"")} · ${esc(T.name_en||"")}</title><style>
  @font-face{font-family:Faruma;src:url("${location.origin}/Faruma%20V2.0%20(official%20release).ttf")}@font-face{font-family:Waheed;src:url(${location.origin}/MV_Waheed.otf)}
  @page{size:A4;margin:12mm}*{box-sizing:border-box}body{margin:0;font:12px/1.45 Arial,Helvetica,sans-serif;color:#111;background:#eee}
  .bar{position:sticky;top:0;background:#C8102E;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font:600 14px Arial}.bar button{background:#fff;color:#C8102E;border:0;border-radius:8px;padding:8px 16px;font:700 14px Arial;cursor:pointer}
  .pg{background:#fff;width:210mm;min-height:297mm;margin:10px auto;padding:12mm;page-break-after:always;position:relative}
  .tn,.dv{font-family:Faruma,"MV Faseyha",Arial,sans-serif}.cm,.bt,[dir=auto]{font-family:Arial,Faruma,"MV Faseyha",sans-serif}.dv{text-align:right;direction:rtl;width:38%}
  .hd{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;font:700 14px/1.35 Arial;margin-bottom:14px}.hd img{width:54px;height:54px}
  table{width:100%;border-collapse:collapse;margin-bottom:12px}td,th{border:1px solid #333;padding:5px 7px;vertical-align:middle}
  .kv td{border-width:0 0 1px;border-style:dashed;border-color:#999}.kv td:first-child{width:30%}.kv .v{text-align:center}.sh th{background:#d9d9d9;font-size:13px;text-align:left}.sh th.dv{text-align:right}.s2 th{background:#f0f0f0}
  .band{border:1px solid #333;background:#d9d9d9;text-align:center;font-weight:700;padding:5px;margin-top:20px}
  .who{margin-bottom:10px}.who td{border:0;padding:3px 4px}.who .v{font-weight:700}
  .sb th{background:#f0f0f0;font-size:11px;text-align:center}.sb td{text-align:center;font-size:12px}.sb .sj{width:16%;font-weight:700}.sb .cm{text-align:start;unicode-bidi:plaintext;width:46%;font-size:12px;line-height:1.9}.sb td.p{background:#f3f3f3}
  .cp th,.cp td{text-align:center}.cd td:first-child{width:36%}.cd .v{text-align:center;font-weight:700}
  .box{border:1px solid #333;margin-bottom:12px}.bh{background:#f0f0f0;padding:6px;text-align:center;font-weight:700;border-bottom:1px solid #333}.bt{padding:10px;min-height:60px;text-align:start;unicode-bidi:plaintext;line-height:2}.sg{display:flex;justify-content:space-between;padding:6px 10px;border-top:1px solid #333}
  .sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sigs>div{border:1px solid #333}.sigs p{margin:6px 10px}
  .mk td,.mk th{text-align:center;padding:10px}.mk th{background:#d9d9d9}.key{font-size:10px;color:#555}
  .ft{position:absolute;left:12mm;right:12mm;bottom:10mm;display:flex;justify-content:space-between;border-top:1px solid #333;padding-top:4px;font-weight:700}
  @media print{body{background:#fff}.bar{display:none}.pg{margin:0;padding:0;width:auto;min-height:0;height:270mm}.ft{left:0;right:0;bottom:0}}
  </style></head><body><div class="bar"><span>${esc(C.class_en||"")} · ${R.students.length} report card${R.students.length===1?"":"s"}</span><button onclick="print()">Print / Save as PDF</button></div>${out||'<p style="padding:20px">No students.</p>'}</body></html>`;}
async function rcPrint(sid){const w=window.open("","_blank");if(w)w.document.write('<p style="font:16px Arial;padding:20px">Loading…</p>');
  try{const R=await rpc("rc_report",{p_term:RC.term,p_class:RC.cls,p_student:sid||null});const html=rcHTML(R);if(w){w.document.open();w.document.write(html);w.document.close();}else{const u=URL.createObjectURL(new Blob([html],{type:"text/html"}));location.href=u;}}
  catch(e){if(w)w.close();alert(e.message);}}
/* ---- events ---- */
document.addEventListener("click",async e=>{const t=e.target;let b;
  if(b=t.closest("[data-rccls]")){rcOpen(b.dataset.rccls,"");return;}
  if(b=t.closest("[data-rcv]")){RC.view=b.dataset.rcv;RC.msg="";render();return;}
  if(t.closest("[data-rcback]")){RC.cls="";RC.view="";RC.rows=null;render();return;}
  if(b=t.closest("[data-rcstu]")){RC.stu=Math.max(0,Math.min((RC.rows||[]).length-1,RC.stu+(+b.dataset.rcstu)));RC.msg="";render();return;}
  if(b=t.closest("[data-rcsave]")){rcSave(b);return;}
  if(b=t.closest("[data-rvok]")){rcRev(b.dataset.rvok,"approved");return;}
  if(b=t.closest("[data-rvback]")){RC.rvNote=b.dataset.rvback;render();const n=$("#rvN");if(n)n.focus();return;}
  if(t.closest("[data-rvcancel]")){RC.rvNote="";render();return;}
  if(b=t.closest("[data-rvsend]")){rcRev(b.dataset.rvsend,"returned",($("#rvN")||{}).value);return;}
  if(b=t.closest("[data-rvundo]")){rcRev(b.dataset.rvundo,"");return;}
  if(b=t.closest("[data-rvs]")){RC.rs=b.dataset.rvs;render();return;}
  if(b=t.closest("[data-rcgo]")){const [c,f,sn]=b.dataset.rcgo.split("|");TAB="report";const v=f==="key_comment"||f==="general_comment"?"class":"s:"+f.replace("_comment","");RC.ct="stu";await rcOpen(c,v);const i=(RC.rows||[]).findIndex(x=>x.name_en===sn);if(i>=0){RC.stu=i;render();setTimeout(()=>{const el=document.querySelector(`.rcs[data-sid="${RC.rows[i].id}"]`);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},60);}return;}
  if(b=t.closest("[data-ct]")){RC.ct=b.dataset.ct;RC.view="class";RC.msg="";render();return;}
  if(b=t.closest("[data-chip]")){const w=b.parentNode,h=w.querySelector("input"),on=b.classList.contains("on");w.querySelectorAll(".chp").forEach(x=>x.classList.remove("on"));if(!on)b.classList.add("on");h.value=on?"":b.dataset.chip;return;}
  if(b=t.closest("[data-rcprint]")){rcPrint(b.dataset.rcprint);return;}
  if(t.closest("[data-auload]")){RC.auq=($("#auQ")||{}).value||"";rcAudit();return;}
  if(b=t.closest("[data-aumore]")){rcAudit(+b.dataset.aumore);return;}
  if(t.closest("[data-rcadmin]")){RC.view="admin";RC.cls="";await rcStaff();render();return;}
  if(t.closest("[data-rcreg]")){try{RC.reg=await rpc("rc_registry");}catch(er){alert(er.message);}render();return;}
  if(b=t.closest("[data-rcedit]")){rcEditForm(b.dataset.rcedit);return;}
  if(t.closest("[data-rcecancel]")){$("#rcEd").innerHTML="";return;}
  if(b=t.closest("[data-rcssave]")){const p={id:b.dataset.rcssave||null},m=$("#rcEMsg");document.querySelectorAll("[data-r]").forEach(el=>p[el.dataset.r]=el.type==="checkbox"?el.checked:(el.value.trim()||null));
    b.disabled=true;try{await rpc("rc_student_save",{p});RC.reg=await rpc("rc_registry");RC.me=await rpc("rc_me");render();}catch(er){b.disabled=false;m.className="msg err";m.textContent=er.message;}return;}
  if(b=t.closest("[data-rctsave]")){const T=rcTerm(),p={...T,id:b.dataset.rctsave||null},m=$("#rcTMsg");document.querySelectorAll("[data-t]").forEach(el=>p[el.dataset.t]=el.type==="checkbox"?el.checked:(el.value.trim()||null));
    p.leads={};document.querySelectorAll("[data-lead]").forEach(el=>{if(el.value.trim())p.leads[el.dataset.lead]=el.value.trim();});if(!p.id){p.name_en=(p.name_en||"")+(p.name_en===T.name_en?" (new)":"");p.class_teachers={};}
    b.disabled=true;try{const r=await rpc("rc_term_save",{p});RC.me=await rpc("rc_me");RC.term=r.id;m.className="msg ok";render();}catch(er){b.disabled=false;m.className="msg err";m.textContent=er.message;}return;}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.abs!=null){const tr=t.closest("tr"),TD=+(rcTerm().teaching_days||0),v=t.value.trim(),a=v!==""&&TD?String(TD-(+v)):"";tr.querySelector(".atd").textContent=a;tr.querySelector('[data-k="att_days"]').value=a;}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="rcTerm"){RC.term=t.value;RC.ret=null;rcRet().then(render);if(RC.cls)rcOpen(RC.cls,RC.view);else render();return;}
  if(t.id==="rvF"){RC.rf=t.value;render();return;}
  if(t.id==="rcStu"){RC.stu=+t.value;RC.msg="";render();return;}
  if(t.dataset&&t.dataset.asg){const [c,s]=t.dataset.asg.split("|"),m=$("#rcAMsg");try{RC.me.assign=await rpc("rc_assign_set",{p_class:c,p_subject:s,p_email:t.value});m.className="msg ok";m.textContent=LANG==="en"?"Saved.":"ރައްކާކުރެވިއްޖެ.";}catch(er){m.className="msg err";m.textContent=er.message;}return;}
  if(t.id==="rcXlsx"&&t.files[0]){const m=$("#rcIMsg");m.className="msg";m.textContent="...";
    try{await loadXLSX();const wb=XLSX.read(await t.files[0].arrayBuffer(),{type:"array",cellDates:true});const {S,E}=rcParse(wb);
      if(!confirm(LANG==="en"?`Import ${S.length} students and ${E.length} report card rows into "${rcTerm().name_en}"?`:`${S.length} ދަރިވަރުންނާއި ${E.length} ރިޕޯޓް ކާޑު "${rcTerm().name_dv||rcTerm().name_en}" އަށް އިމްޕޯޓް ކުރަންތަ؟`)){m.textContent="";return;}
      const r=await rpc("rc_import",{p_term:RC.term,p_students:S,p_entries:E});RC.reg=await rpc("rc_registry");RC.me=await rpc("rc_me");render();const m2=$("#rcIMsg");if(m2){m2.className="msg ok";m2.textContent=(LANG==="en"?"Imported: ":"އިމްޕޯޓް ވެއްޖެ: ")+`${r.students} / ${r.entries}`;}}
    catch(er){m.className="msg err";m.textContent=er.message;}t.value="";}
});

if(S)start();
