:root{--p:#C8102E;--p2:#A50D26;--ps:rgba(200,16,46,.08);--a:#C8102E;--as:rgba(17,17,17,.07);--k:#111111;--bg:#F7F8FC;--text:#1F2937;--muted:#6B7280;--line:#E8EBF2;--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{background:#F4F4F6;overscroll-behavior-y:none}body{overscroll-behavior-y:none}
body{font-family:"Faruma",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;touch-action:pan-y pinch-zoom}
html[lang=en] body{font-family:"Plus Jakarta Sans",sans-serif;line-height:1.6}
html[lang=dv] .en,html[lang=en] .dv{display:none!important}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.num,.ltr{font-family:"Plus Jakarta Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.h{font-family:"KondeyHeading","Faruma",sans-serif;font-weight:400}
html[lang=en] .h{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
/* top bar */
.top{background:#0B0B0B;color:#fff;font-size:14px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:44px;gap:10px}
.top-l{display:flex;gap:18px;align-items:center}
.top-l a{display:inline-flex;gap:6px;align-items:center;opacity:.92}
.top-l a:hover{opacity:1}
.soc{display:flex;gap:6px}
.soc a{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.soc a:hover{background:#111;color:#fff}
.lang{background:#fff;color:var(--p);border:0;border-radius:9px;padding:4px 12px;font-weight:800;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px}
/* header */
.head{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:50%;background:var(--ps);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:2px solid #fff;box-shadow:0 0 0 2px var(--ps)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo svg{color:var(--p)}
.brand b{display:block;font-size:24px;color:var(--p);line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:13px}
html[lang=dv] .brand small{font-family:"KondeyHeading","Faruma",sans-serif;font-size:14px}
.nav{display:flex;gap:2px}
.nav a{padding:9px 13px;border-radius:12px;font-size:15.5px;color:#374151;font-family:"KondeyHeading","Faruma",sans-serif}
html[lang=en] .nav a{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:14px}
.nav a:hover{background:var(--ps);color:var(--p)}
.nav a.on{background:var(--p);color:#fff}.nav a:hover{color:var(--p)}
.burger{display:none;background:none;border:0;width:44px;height:44px;border-radius:12px;color:var(--p)}
.mnav{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45)}
.mnav.open{display:block}
.mnav-p{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(340px,86vw);background:#fff;padding:22px;display:flex;flex-direction:column;gap:4px;overflow:auto;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
html[dir=ltr] .mnav-p{animation-name:slideL}@keyframes slideL{from{transform:translateX(-100%)}to{transform:none}}
.mnav-p a{padding:13px 14px;border-radius:12px;font-family:"KondeyHeading","Faruma",sans-serif;font-size:18px;display:flex;justify-content:space-between;align-items:center}
html[lang=en] .mnav-p a{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:16px}
.mnav-p a.on,.mnav-p a:hover{background:var(--ps);color:var(--p)}
.mnav-x{align-self:flex-start;background:var(--ps);border:0;border-radius:12px;width:40px;height:40px;color:var(--p);margin-bottom:10px;font-size:20px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B0B0B 0%,#1A1A1A 55%,#6B0F1A 100%);color:#fff}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28}
.hero::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(200,16,46,.45),transparent 65%);inset-inline-start:-160px;top:-200px}
.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.05);inset-inline-end:-140px;bottom:-200px}
.hero .wrap{position:relative;z-index:1;padding-top:70px;padding-bottom:110px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero-tag{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:14px}
html[lang=dv] .hero-tag{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
.hero h1{font-size:58px;line-height:1.25;margin:16px 0 8px}
html[lang=en] .hero h1{font-size:52px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#FF3550}
.hero p.motto{font-size:21px;opacity:.9;font-family:"KondeyHeading","Faruma",sans-serif}
html[lang=en] .hero p.motto{font-family:"Plus Jakarta Sans",sans-serif;font-size:19px;font-style:italic}
.hero-btns{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:12px 22px;font-family:"KondeyHeading","Faruma",sans-serif;font-size:17px;border:0;transition:transform .15s,box-shadow .15s}
html[lang=en] .btn{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:15px}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--p);color:#fff;box-shadow:0 8px 20px rgba(200,16,46,.4)}
.btn-g{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-p{background:var(--p);color:#fff}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:28px;backdrop-filter:blur(6px);text-align:center}
.hero-logo{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.hero-logo img{width:86%;height:86%;object-fit:contain}
.hero-logo svg{color:var(--p)}
.hero-card b{display:block;font-size:22px}
.hero-card small{display:block;opacity:.8;font-size:14px}
html[lang=dv] .hero-card small{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
/* stats */
.stats{position:relative;z-index:2;margin-top:-62px}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.st{background:#fff;border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(15,23,42,.08);border:1px solid var(--line)}
.st-ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--ps);color:var(--p);flex:0 0 auto}
.st:nth-child(2) .st-ic{background:var(--as);color:var(--k)}
.st:nth-child(3) .st-ic{background:var(--ps);color:var(--p)}
.st:nth-child(4) .st-ic{background:var(--as);color:var(--k)}
.st-ic svg{display:block;flex:0 0 auto}.st b{display:block;font-size:28px;font-weight:800;line-height:1.1;color:var(--text)}
.st div>span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
html[lang=dv] .st div>span{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
/* sections */
.sec{padding:44px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:34px;color:var(--p);line-height:1.3}
html[lang=en] .sec-h h2{font-size:30px}
.sec-h p{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--p);font-size:14px;margin-bottom:4px}
html[lang=dv] .eyebrow{font-family:"KondeyHeading","Faruma",sans-serif;font-size:16px}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--k)}
.more{display:inline-flex;align-items:center;gap:6px;color:var(--p);font-family:"KondeyHeading","Faruma",sans-serif;font-size:16px;padding:8px 14px;border-radius:12px;background:var(--ps)}
html[lang=en] .more{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:14px}
.more:hover{background:var(--p);color:#fff}
/* about */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
.about-txt p{font-size:17px;color:#374151;margin-bottom:16px}
.vm{display:grid;gap:14px}
.vm-c{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;gap:16px}
.vm-c .st-ic{width:48px;height:48px}
.vm-c h3{font-size:21px;color:var(--p);margin-bottom:4px}
.vm-c p{color:#4B5563;font-size:15.5px}
.motto-c{background:linear-gradient(135deg,#111,#3A0A12);border:0;color:#fff}
.motto-c h3{color:#fff}.motto-c .st-ic{background:var(--p);color:#fff}
.motto-c p{color:#fff;font-size:19px;font-family:"KondeyHeading","Faruma",sans-serif}
html[lang=en] .motto-c p{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-style:italic;font-size:17px}
/* principal */
.pm{display:grid;grid-template-columns:240px 1fr;gap:30px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;align-items:center}
.pm-ph{width:240px;height:280px;border-radius:22px;background:var(--ps);overflow:hidden;display:grid;place-items:center;color:var(--p)}
.pm-ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.pm q{display:block;position:relative;font-size:18px;line-height:1.95;color:#374151;quotes:none;text-align:start;padding-top:6px}
.pm q p{margin:0 0 12px}.pm q p:last-child{margin-bottom:0}
.pm q::before{content:"”";position:absolute;inset-inline-end:-4px;top:-38px;font-family:Georgia,serif;font-size:90px;line-height:1;color:var(--p);opacity:.12;pointer-events:none}
html .pm .eyebrow{margin-bottom:14px}html[lang=dv] .pm .eyebrow{font-size:24px}html[lang=en] .pm .eyebrow{font-size:18px}
.pm-n{margin-top:18px;padding-inline-start:14px;border-inline-start:4px solid var(--p);text-align:start}
.pm-n{margin-top:16px}.pm-n b{display:block;font-size:20px;color:var(--p)}.pm-n span{color:var(--muted)}
html[lang=dv] .pm-n span{font-family:"KondeyHeading","Faruma",sans-serif}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.nc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.nc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.08)}
.nc-img{aspect-ratio:16/10;background:linear-gradient(135deg,var(--ps),var(--as));display:grid;place-items:center;color:var(--p);overflow:hidden}
.nc-img img{width:100%;height:100%;object-fit:cover}
.nc-b{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.nc-d{color:var(--muted);font-size:13.5px;display:flex;gap:6px;align-items:center}
html[lang=dv] .nc-d{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
.nc h3{font-size:19px;line-height:1.6;color:var(--text)}
html[lang=en] .nc h3{font-size:17px;line-height:1.45}
.nc p{color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* notices */
.nl{display:grid;gap:12px}
.ni{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:16px;align-items:center;transition:border-color .2s,box-shadow .2s}
.ni:hover{border-color:var(--p);box-shadow:0 8px 20px rgba(15,23,42,.06)}
.ni-d{flex:0 0 auto;width:62px;text-align:center;background:var(--ps);border-radius:14px;padding:8px 4px;color:var(--p)}
.ni-d b{display:block;font-size:22px;font-weight:800;line-height:1}
.ni-d span{display:block;font-size:12px;margin-top:4px;font-family:"KondeyHeading","Faruma",sans-serif}
html[lang=en] .ni-d span{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;text-transform:uppercase}
.ni-m{flex:1;min-width:0}
.ni-m h3{font-size:17.5px;line-height:1.6}
html[lang=en] .ni-m h3{font-size:16px}
.tag{display:inline-block;border-radius:8px;padding:2px 10px;font-size:12.5px;background:var(--ps);color:var(--p);margin-bottom:4px}
html[lang=dv] .tag{font-family:"KondeyHeading","Faruma",sans-serif;font-size:14px}
.tag.vacancy{background:var(--p);color:#fff}.tag.tender{background:var(--k);color:#fff}.tag.circular{background:var(--as);color:var(--k)}.tag.student{background:#E0F2FE;color:#0369A1}
.ni-go{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--p)}
html[dir=ltr] .ni-go svg{transform:scaleX(-1)}
.ni-dl{font-size:13px;color:#B91C1C;margin-top:2px}
html[lang=dv] .ni-dl{font-family:"KondeyHeading","Faruma",sans-serif;font-size:14.5px}
/* home 2 col */
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}
.ev{display:grid;gap:10px}
.evi{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.evi .ni-d{background:var(--as);color:var(--k);width:56px}
.evi h4{font-size:16.5px;line-height:1.5}
html[lang=en] .evi h4{font-size:15px}
.evi small{color:var(--muted)}
html[lang=dv] .evi small{font-family:"KondeyHeading","Faruma",sans-serif;font-size:14px}
.evi.holiday .ni-d{background:var(--k);color:#fff}.evi.exam .ni-d{background:var(--p);color:#fff}
/* staff */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;transition:transform .2s,box-shadow .2s}
.sc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.08)}
.sc-ph{width:110px;height:110px;border-radius:50%;margin:0 auto 12px;background:var(--ps);display:grid;place-items:center;overflow:hidden;color:var(--p);font-size:38px;border:4px solid #fff;box-shadow:0 0 0 2px var(--ps)}
.sc-ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.sc b{display:block;font-size:17px;line-height:1.5}
html[lang=en] .sc b{font-size:15.5px}
.sc>span{display:block;color:var(--muted);font-size:14px}
html[lang=dv] .sc>span{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
.sc .tag{margin-top:8px}.sc-ct{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.sc-ct a{display:inline-flex;font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;align-items:center;justify-content:center;gap:6px;color:#4B5563;font-size:13px;word-break:break-all}.sc-ct a:hover{color:var(--p)}.sc-ct svg{flex:0 0 auto;color:var(--p)}
.grp-h{font-size:22px;color:var(--p);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
/* classes */
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.clc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.clc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--p),var(--k))}
.clc h3{font-size:22px;color:var(--p)}
.clc .row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:#4B5563;font-size:14.5px}
.clc .row b{color:var(--text)}
/* gallery */
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.al{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,#111,#3A0A12);display:block;color:#fff}
.al img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.al:hover img{transform:scale(1.05)}
.al-o{position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,23,42,.8),transparent 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.al-o b{font-size:18px;line-height:1.5}
.al-o small{opacity:.85}
.al-n{position:absolute;top:12px;inset-inline-end:12px;background:rgba(15,23,42,.55);border-radius:999px;padding:3px 10px;font-size:13px;backdrop-filter:blur(4px)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pg a{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--ps)}
.pg img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.pg a:hover img{transform:scale(1.06)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.94);display:flex;align-items:center;justify-content:center}
.lb img{max-width:94vw;max-height:84vh;border-radius:10px}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:24px}
.lb .x{top:16px;inset-inline-end:16px}.lb .p{inset-inline-start:16px}.lb .n{inset-inline-end:16px}
.lb .c{position:absolute;bottom:18px;color:#fff;opacity:.8;font-family:"Plus Jakarta Sans",sans-serif}
/* page */
.ph{background:linear-gradient(135deg,#0B0B0B,#2A0A10 60%,var(--p));color:#fff;padding:32px 0 74px;position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:50px solid rgba(255,255,255,.05);inset-inline-start:-80px;top:-120px}
.ph h1{font-size:40px;line-height:1.3;position:relative;z-index:1;text-align:center}.ph .crumb{justify-content:center}
html[lang=en] .ph h1{font-size:34px}
.crumb{opacity:.8;font-size:14px;position:relative;z-index:1;display:flex;gap:6px;align-items:center}
html[lang=dv] .crumb{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
.pb{margin-top:-46px;position:relative;z-index:2;padding-bottom:28px}
.panel{background:#fff;border-radius:28px;padding:24px;border:1px solid var(--line);box-shadow:0 12px 30px rgba(15,23,42,.05)}
.art{max-width:820px;margin:0 auto}
.art h1{font-size:32px;line-height:1.5;color:var(--text);margin:8px 0 14px}
html[lang=en] .art h1{font-size:28px;line-height:1.3}
.art .cover{border-radius:20px;overflow:hidden;margin:18px 0}
.art .body p{font-size:18px;color:#374151;margin-bottom:16px}
html[lang=en] .art .body p{font-size:16.5px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--p);font-family:"KondeyHeading","Faruma",sans-serif;font-size:16px;margin-bottom:12px}
html[lang=en] .back{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:14px}
html[dir=ltr] .back svg{transform:scaleX(-1)}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px;color:#4B5563}
html[lang=en] .chips button{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:13.5px}
.chips button.on{background:var(--p);border-color:var(--p);color:#fff}
.empty{text-align:center;color:var(--muted);padding:18px 10px;font-family:"KondeyHeading","Faruma",sans-serif;font-size:17px}
html[lang=en] .empty{font-family:"Plus Jakarta Sans",sans-serif;font-size:15px}
/* contact */
.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cti{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.cti small{color:var(--muted)}
html[lang=dv] .cti small{font-family:"KondeyHeading","Faruma",sans-serif;font-size:15px}
.cti b{font-size:18px}
.map{margin-top:16px;border-radius:24px;overflow:hidden;border:1px solid var(--line);height:360px;background:var(--ps)}
.map iframe{width:100%;height:100%;border:0}
.ch-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:14px;color:var(--muted)}
.ch-search:focus-within{border-color:var(--p);color:var(--p)}
.ch-search input{flex:1;border:0;outline:0;background:none;padding:13px 0;font-size:16px;min-width:0;font-family:inherit}
html[lang=dv] .ch-search input{font-family:"KondeyHeading","Faruma",sans-serif}
.sc-nav{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#111,#3A0A12);border-radius:20px;padding:12px;color:#fff}
.sc-nav .chv-b{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}.sc-nav .chv-b:hover{background:var(--p)}
.sc-date{flex:1;text-align:center;position:relative}
.sc-date b{font-size:22px;display:block;line-height:1.5}
html[lang=en] .sc-date b{font-size:18px}
.sc-date input{margin-top:6px;border:0;border-radius:10px;padding:6px 10px;font-family:"Plus Jakarta Sans",sans-serif;background:rgba(255,255,255,.12);color:#fff;color-scheme:dark}
.sc-quick{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px}
.sc-quick button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-family:"KondeyHeading","Faruma",sans-serif;font-size:14.5px;color:#4B5563}
html[lang=en] .sc-quick button{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:13px}
.sc-quick button:first-child{background:var(--p);border-color:var(--p);color:#fff}
.sc-quick button.on{border-color:var(--k);color:var(--k);background:var(--as)}
.sc-sum{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:10px 0 16px;color:#4B5563;font-family:"KondeyHeading","Faruma",sans-serif;font-size:16px}
html[lang=en] .sc-sum{font-family:"Plus Jakarta Sans",sans-serif;font-size:14px}
.sc-sum b{color:var(--k);font-size:18px}
.sc-live{display:inline-flex;align-items:center;gap:6px;color:#047857}
.sc-live i{width:9px;height:9px;border-radius:50%;background:#10B981;box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.sc-vf{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.sc-vf button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;font:inherit;font-size:14px;color:#4B5563}
.sc-vf button.on{background:var(--k);border-color:var(--k);color:#fff}

    <div id="scBody">${scBody()}</div></div></div></div>`;}
function scGo(d){SCD=d;const t=document.getElementById("scTitle");if(!t)return;t.innerHTML=scDayTitle(d);document.getElementById("scPick").value=d;document.querySelectorAll("[data-scgo]").forEach(b=>b.classList.toggle("on",b.dataset.scgo===d&&b!==document.querySelector("[data-scgo]")));SCV="all";document.getElementById("scBody").innerHTML=scBody();}

  const g=e.target.closest("[data-scgo]");if(g){scGo(g.dataset.scgo);return;}

function contactBlock(){const ph=(INFO.phone||"").replace(/\D/g,"");

    ${INFO.email?`<a class="cti reveal" href="mailto:${esc(INFO.email)}"><span class="st-ic">${IC.mail}</span><small>${bi("އީމެއިލް","Email")}</small><b style="font-size:15px"><span class="ltr">${esc(INFO.email)}</span></b></a>`:`<a class="cti reveal" href="${esc(safeUrl(INFO.facebook)||"#")}" target="_blank" rel="noopener"><span class="st-ic">${IC.fb.replace(/15/g,"24")}</span><small>${bi("ފޭސްބުކް","Facebook")}</small><b style="font-size:15px"><span class="ltr">facebook.com/KondeySchool</span></b></a>`}
    <div class="cti reveal"><span class="st-ic">${IC.pin}</span><small>${bi("އެޑްރެސް","Address")}</small><b class="h" style="font-size:17px">${L2(INFO,"address")}</b></div></div>
  <div class="map reveal"><iframe loading="lazy" title="Map" src="https://www.openstreetmap.org/export/embed.html?bbox=73.540%2C0.488%2C73.558%2C0.510&layer=mapnik&marker=0.4986%2C73.5486"></iframe></div>`;}

function route(){
  const h=decodeURIComponent(location.hash.slice(1))||"home"; let html, key=h;
  if(h.startsWith("news-")){html=detail(NEWS.find(n=>n.id===h.slice(5)),"news","ޚަބަރަށް","Back to news");key="news";}
  else if(h.startsWith("notice-")){{const o=NOTICES.find(n=>n.id===h.slice(7)),st=o&&o.type==="student";html=st?detail(o,"snotices","ދަރިވަރުންގެ އިޢުލާންތަކަށް","Back to student notices",1):detail(o,"notices","އިޢުލާންތަކަށް","Back to notices",1);key=st?"snotices":"notices";}}
  else if(h.startsWith("album-")){html=albumPage(ALBUMS.find(a=>a.id===h.slice(6)));key="gallery";}
  else if(h.startsWith("about/")){html=aboutPage();key=h;}
  else html=({home,pta:()=>groupPage("pta"),scouncil:()=>groupPage("scouncil"),snotices:studentNoticesPage,structure:structurePage,calendar:calendarPage,activities:activitiesPage,schedule:schedulePage,charter:charterPage,about:aboutPage,staff:staffPage,news:newsPage,notices:noticesPage,students:studentsPage,gallery:galleryPage,contact:contactPage}[h]||home)();
  document.getElementById("app").innerHTML=html;
  const pk=PARENT[key]||key;document.querySelectorAll("[data-k]").forEach(a=>a.classList.toggle("on",a.dataset.k===key||a.dataset.k===pk));
  document.getElementById("mnav").classList.remove("open");
  {const an=key==="activities"&&document.getElementById("act-next");if(an){document.documentElement.style.scrollBehavior="auto";an.classList.add("in");scrollTo({top:an.getBoundingClientRect().top+scrollY-170,behavior:"instant"});}else sTo({top:0,behavior:"instant"});} reveal();
  if(h.startsWith("about/")){const el=document.getElementById("ab-"+h.slice(6));if(el)setTimeout(()=>{el.classList.add("in","hl");const y=el.getBoundingClientRect().top+sY()-110;sTo({top:y,behavior:"smooth"});setTimeout(()=>el.classList.remove("hl"),2200);},60);}
}
const SCR=()=>getComputedStyle(document.body).position==="fixed"?document.body:null;
const sY=()=>{const b=SCR();return b?b.scrollTop:scrollY;};
const sTo=o=>{const b=SCR();(b||window).scrollTo(o);};
function countUp(el){const t=el.textContent,m=t.match(/^(\d+)(.*)$/);if(!m||el.dataset.cu)return;el.dataset.cu=1;const n=+m[1],suf=m[2];if(n<2)return;const t0=performance.now(),d=900;const f=now=>{const p=Math.min(1,(now-t0)/d),v=Math.round(n*(1-Math.pow(1-p,3)));el.textContent=v+suf;if(p<1)requestAnimationFrame(f);};el.textContent="0"+suf;requestAnimationFrame(f);}
let IO; function reveal(){if(!("IntersectionObserver"in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));return;}
  IO=IO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");e.target.querySelectorAll&&e.target.querySelectorAll(".st b.num").forEach(countUp);IO.unobserve(e.target);}}),{rootMargin:"0px 0px -40px"});
  document.querySelectorAll(".reveal:not(.in)").forEach(e=>IO.observe(e));}
function setLang(l){document.documentElement.lang=l;document.documentElement.dir=l==="en"?"ltr":"rtl";document.getElementById("langBtn").textContent=l==="en"?"ދިވެހި":"EN";try{localStorage.setItem("ks_lang",l)}catch(_){}
  document.title=l==="en"?`${INFO.name_en} · GA. Kondey`:`${INFO.name_dv} · ގއ.ކޮނޑޭ`;}

document.getElementById("mnav").addEventListener("click",e=>{const tg=e.target.closest("[data-mtog]");if(tg){tg.parentNode.classList.toggle("open");return;}if(e.target.id==="mnav"||e.target.closest("[data-close]"))e.currentTarget.classList.remove("open");});
document.addEventListener("click",e=>{
  if(acClick(e))return;
  const sh=e.target.closest("[data-share]");if(sh){const u=location.href,tt=document.querySelector(".nd-t")?.innerText||document.title;if(navigator.share){navigator.share({title:tt,url:u}).catch(()=>{});}else{navigator.clipboard?.writeText(u).then(()=>{sh.querySelector(".dv")&&(sh.querySelector(".dv").textContent="ލިންކް ކޮޕީކުރެވިއްޖެ");});}return;}
  const nt=e.target.closest("[data-nt]");if(nt){NTYPE=nt.dataset.nt;nt.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===nt));document.getElementById("ntList").innerHTML=noticesBody();reveal();return;}
  const a=e.target.closest(".mt-gal a[data-lb]");if(!a)return;e.preventDefault();
  openLB([...a.closest(".mt-gal").querySelectorAll("a[data-lb]")].map(x=>x.href),+a.dataset.lb);
});
function openLB(L,i){
  const d=document.createElement("div");d.className="lb";d.innerHTML=`<img alt=""><button class="x" type="button">✕</button>${L.length>1?'<button class="p" type="button">‹</button><button class="n" type="button">›</button>':""}<span class="c"></span>`;
  const show=k=>{i=(k+L.length)%L.length;d.querySelector("img").src=L[i];d.querySelector(".c").textContent=`${i+1} / ${L.length}`;};
  d.onclick=ev=>{if(ev.target.closest(".n"))show(i+1);else if(ev.target.closest(".p"))show(i-1);else if(ev.target.closest(".x")||ev.target===d){d.remove();document.body.style.overflow="";}};
  let sx=null;d.addEventListener("touchstart",ev=>sx=ev.touches[0].clientX,{passive:true});d.addEventListener("touchend",ev=>{if(sx==null)return;const dx=ev.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));sx=null;});
  document.body.appendChild(d);document.body.style.overflow="hidden";show(i);
}

{let ty=0;addEventListener("touchstart",e=>{ty=e.touches[0].clientY;},{passive:true});addEventListener("touchmove",e=>{if(document.getElementById("mnav").classList.contains("open")||e.touches.length>1)return;const dy=e.touches[0].clientY-ty,atEnd=Math.ceil(scrollY+innerHeight)>=document.documentElement.scrollHeight-1;if(atEnd&&dy<0&&e.cancelable)e.preventDefault();},{passive:false});}

const PTA=[],SCOUNCIL=[];
const DB={pta:PTA,scouncil:SCOUNCIL,news:NEWS,notices:NOTICES,staff:STAFF,albums:ALBUMS,events:EVENTS,classes:CLASSES,chsec:CHSEC,chsvc:CHSVC,schedule:SCHEDULE};
async function loadDB(){
  if(!DB_LOADING) return;
  try{const r=await fetch(`${SB_URL}/rest/v1/school_content?select=section,data&published=eq.true&order=position.asc&limit=5000`,{headers:{apikey:SB_KEY}});
    if(!r.ok) return; const rows=await r.json(); if(!rows.length) return;
    const clean=v=>typeof v==="string"?v.replace(/<[^>]*>/g,""):Array.isArray(v)?v.map(clean):v&&typeof v==="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,clean(x)])):v;
    const by={}; rows.forEach(x=>(by[x.section]=by[x.section]||[]).push(clean(x.data)));
    for(const [k,arr] of Object.entries(DB)) if(by[k]) arr.splice(0,arr.length,...by[k]);
    if(by.info&&by.info[0]) INFO={...INFO,...by.info[0]};
    DB_LOADING=false; header(); setLang(document.documentElement.lang); route();
  }catch(e){}
  if(DB_LOADING){DB_LOADING=false;route();}
}
let L0="dv";try{L0=localStorage.getItem("ks_lang")||"dv"}catch(_){}
header(); setLang(L0); route(); loadDB();
