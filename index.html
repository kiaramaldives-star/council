:root{--p:#C8102E;--p2:#A50D26;--ps:rgba(200,16,46,.08);--a:#C8102E;--as:rgba(17,17,17,.07);--k:#111111;--bg:#F7F8FC;--text:#1F2937;--muted:#6B7280;--line:#E8EBF2;--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:"Faruma",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;touch-action:pan-y pinch-zoom}
html[lang=en] body{font-family:"Plus Jakarta Sans",sans-serif;line-height:1.6}
html[lang=dv] .en,html[lang=en] .dv{display:none!important}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.num,.ltr{font-family:"Plus Jakarta Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.h{font-family:"KondeyHeading","Faruma",sans-serif;font-weight:400}
html[lang=en] .h{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
/* top bar */
.top{background:#0B0B0B;color:#fff;font-size:14px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:44px;gap:10px}
.top-l{display:flex;gap:18px;align-items:center}
.top-l a{display:inline-flex;gap:6px;align-items:center;opacity:.92}
.top-l a:hover{opacity:1}
.soc{display:flex;gap:6px}
.soc a{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.soc a:hover{background:#111;color:#fff}
.lang{background:#fff;color:var(--p);border:0;border-radius:9px;padding:4px 12px;font-weight:800;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px}
/* header */
.head{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:50%;background:var(--ps);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:2px solid #fff;box-shadow:0 0 0 2px var(--ps)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo svg{color:var(--p)}
.brand b{display:block;font-size:24px;color:var(--p);line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:13px}
html[lang=dv] .brand small{font-family:"KondeyHeading","Faruma",sans-serif;font-size:14px}
.nav{display:flex;gap:2px}
.nav a{padding:9px 13px;border-radius:12px;font-size:15.5px;color:#374151;font-family:"KondeyHeading","Faruma",sans-serif}
html[lang=en] .nav a{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:14px}
.nav a:hover{background:var(--ps);color:var(--p)}
.nav a.on{background:var(--p);color:#fff}.nav a:hover{color:var(--p)}

  const groups=[["lead",["principal","deputy","leading"],"ލީޑަރޝިޕް ޓީމް","Leadership team"],["teach",["teacher"],"މުދައްރިސުން","Teachers"],["oth",["admin","support"],"އިދާރީ އަދި އެހީތެރި މުވައްޒަފުން","Administrative & support staff"]];

  return pageHead("މުވައްޒަފުން","Staff")+`<div class="pb"><div class="wrap"><div class="panel">${body}</div></div></div>`;}
let NTYPE="all";
function newsPage(){return pageHead("ޚަބަރު","News")+`<div class="pb"><div class="wrap"><div class="panel">${NEWS.length?`<div class="grid3">${sortD(NEWS).map(newsCard).join("")}</div>`:empty("އަދި ޚަބަރެއް ނެތް","No news yet")}</div></div></div>`;}

function detail(o,back,backDv,backEn,isNotice){

  return pageHead(isNotice?"އިޢުލާން":"ޚަބަރު",isNotice?"Notice":"News")+`<div class="pb"><div class="wrap"><div class="panel"><article class="art">
    <a class="back" href="#${back}">${IC.back}${bi(backDv,backEn)}</a>
    ${isNotice?`<span class="tag ${esc(o.type||"notice")}">${bi(t[0],t[1])}</span>`:""}

    <h1 class="h">${L2(o,"title")}</h1>
    ${o.deadline?`<div class="ni-dl" style="font-size:16px">${bi("ސުންގަޑި:","Deadline:")} ${nDate(o.deadline)}</div>`:""}
    ${im?`<div class="cover"><img src="${esc(im)}" alt=""></div>`:""}

    <div class="files">${pdf?`<a class="btn btn-p" href="${esc(pdf)}" target="_blank" rel="noopener">${bi("ލިޔުން ބައްލަވާ (PDF)","Open document (PDF)")}</a>`:""}${safeUrl(o.source)?`<a class="more" href="${esc(safeUrl(o.source))}" target="_blank" rel="noopener">${bi("ސޯސް","Source")}</a>`:""}</div>
  </article></div></div></div>`;}
function studentsPage(){
  const today=new Date().toISOString().slice(0,10), ev=EVENTS.slice().sort((a,b)=>String(a.date).localeCompare(b.date)), up=ev.filter(e=>(e.end||e.date||"")>=today), past=ev.filter(e=>(e.end||e.date||"")<today).reverse();
  const total=CLASSES.reduce((s,c)=>s+(+c.students||0),0);
  return pageHead("ދަރިވަރުން","Students")+`<div class="pb"><div class="wrap"><div class="panel">
    <div class="sec-h"><div><div class="eyebrow">${bi("ކްލާސްތައް","Classes")}</div><h2 class="h">${bi("ގްރޭޑްތަކާއި ކްލާސްތައް","Grades & classes")}</h2></div>${total?`<span class="more"><span class="num">${total}</span> ${bi("ދަރިވަރުން","students")}</span>`:""}</div>
    ${CLASSES.length?`<div class="cl">${CLASSES.slice().sort((a,b)=>(+a.order||0)-(+b.order||0)).map(c=>`<div class="clc reveal"><h3 class="h">${L2(c,"name")}</h3>${c.teacher_dv||c.teacher_en?`<div class="row"><span>${bi("ކްލާސް ޓީޗަރ","Class teacher")}</span><b>${L2(c,"teacher")}</b></div>`:""}${c.students?`<div class="row"><span>${bi("ދަރިވަރުން","Students")}</span><b class="num">${esc(c.students)}</b></div>`:""}</div>`).join("")}</div>`:empty("ކްލާސްތަކުގެ މަޢުލޫމާތު ވަރަށް އަވަހަށް","Class details coming soon")}
    <div class="sec-h" style="margin-top:40px"><div><div class="eyebrow">${bi("ސްކޫލް ކެލެންޑަރު","School calendar")}</div><h2 class="h">${bi("ކުރިއަށް އޮތް ހަރަކާތްތައް","Upcoming")}</h2></div></div>
    ${up.length?`<div class="ev">${up.map(eventItem).join("")}</div>`:empty("ކުރިއަށް އޮތް ހަރަކާތެއް ނެތް","No upcoming events")}
    ${past.length?`<h2 class="grp-h h">${bi("ފާއިތުވި","Past")}</h2><div class="ev" style="opacity:.75">${past.slice(0,10).map(eventItem).join("")}</div>`:""}
  </div></div></div>`;}
function albumCard(a){const ph=(a.photos||[]).map(safeUrl).filter(Boolean),c=safeUrl(a.cover)||ph[0];
  return `<a class="al reveal" href="#album-${esc(a.id)}">${c?`<img src="${esc(c)}" alt="" loading="lazy">`:""}<span class="al-n num">${ph.length} 📷</span><span class="al-o"><b class="h">${L2(a,"title")}</b><small>${nDate(a.date)}</small></span></a>`;}
function galleryPage(){return pageHead("ގެލަރީ","Gallery")+`<div class="pb"><div class="wrap"><div class="panel">${ALBUMS.length?`<div class="ag">${sortD(ALBUMS).map(albumCard).join("")}</div>`:empty("ފޮޓޯ އަލްބަމްތައް ވަރަށް އަވަހަށް","Photo albums coming soon")}</div></div></div>`;}
function albumPage(a){if(!a)return detail(null);const ph=(a.photos||[]).map(safeUrl).filter(Boolean);
  return pageHead("ގެލަރީ","Gallery")+`<div class="pb"><div class="wrap"><div class="panel"><a class="back" href="#gallery">${IC.back}${bi("ގެލަރީއަށް","Back to gallery")}</a><h1 class="h" style="font-size:28px;color:var(--p);margin-bottom:6px">${L2(a,"title")}</h1><div class="nc-d" style="margin-bottom:16px">${nDate(a.date)}</div>
    ${ph.length?`<div class="pg mt-gal">${ph.map((u,i)=>`<a href="${esc(u)}" data-lb="${i}"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join("")}</div>`:empty("ފޮޓޯއެއް ނެތް","No photos")}</div></div></div>`;}
function contactBlock(){const ph=(INFO.phone||"").replace(/\D/g,"");
  return `<div class="sec-h"><div><h2 class="h">${bi("އަޅުގަނޑުމެންނަށް ގުޅުއްވާ","Contact us")}</h2></div></div>

    ${INFO.email?`<a class="cti reveal" href="mailto:${esc(INFO.email)}"><span class="st-ic">${IC.mail}</span><small>${bi("އީމެއިލް","Email")}</small><b style="font-size:15px"><span class="ltr">${esc(INFO.email)}</span></b></a>`:`<a class="cti reveal" href="${esc(safeUrl(INFO.facebook)||"#")}" target="_blank" rel="noopener"><span class="st-ic">${IC.fb.replace(/15/g,"24")}</span><small>${bi("ފޭސްބުކް","Facebook")}</small><b style="font-size:15px"><span class="ltr">facebook.com/KondeySchool</span></b></a>`}
    <div class="cti reveal"><span class="st-ic">${IC.pin}</span><small>${bi("އެޑްރެސް","Address")}</small><b class="h" style="font-size:17px">${L2(INFO,"address")}</b></div></div>

function route(){
  const h=decodeURIComponent(location.hash.slice(1))||"home"; let html, key=h;
  if(h.startsWith("news-")){html=detail(NEWS.find(n=>n.id===h.slice(5)),"news","ޚަބަރަށް","Back to news");key="news";}
  else if(h.startsWith("notice-")){html=detail(NOTICES.find(n=>n.id===h.slice(7)),"notices","އިޢުލާންތަކަށް","Back to notices",1);key="notices";}
  else if(h.startsWith("album-")){html=albumPage(ALBUMS.find(a=>a.id===h.slice(6)));key="gallery";}
  else html=({home,about:aboutPage,staff:staffPage,news:newsPage,notices:noticesPage,students:studentsPage,gallery:galleryPage,contact:contactPage}[h]||home)();
  document.getElementById("app").innerHTML=html;
  document.querySelectorAll("[data-k]").forEach(a=>a.classList.toggle("on",a.dataset.k===key));
  document.getElementById("mnav").classList.remove("open");
  scrollTo(0,0); reveal();
}
let IO; function reveal(){if(!("IntersectionObserver"in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));return;}
  IO=IO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");IO.unobserve(e.target);}}),{rootMargin:"0px 0px -40px"});
  document.querySelectorAll(".reveal:not(.in)").forEach(e=>IO.observe(e));}
function setLang(l){document.documentElement.lang=l;document.documentElement.dir=l==="en"?"ltr":"rtl";document.getElementById("langBtn").textContent=l==="en"?"ދިވެހި":"EN";try{localStorage.setItem("ks_lang",l)}catch(_){}
  document.title=l==="en"?`${INFO.name_en} · GA. Kondey`:`${INFO.name_dv} · ގއ. ކޮނޑޭ`;}
document.getElementById("langBtn").onclick=()=>setLang(document.documentElement.lang==="en"?"dv":"en");
document.getElementById("burger").onclick=()=>document.getElementById("mnav").classList.add("open");
document.getElementById("mnav").addEventListener("click",e=>{if(e.target.id==="mnav"||e.target.closest("[data-close]"))e.currentTarget.classList.remove("open");});
document.addEventListener("click",e=>{
  const nt=e.target.closest("[data-nt]");if(nt){NTYPE=nt.dataset.nt;nt.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===nt));document.getElementById("ntList").innerHTML=noticesBody();reveal();return;}
  const a=e.target.closest(".mt-gal a[data-lb]");if(!a)return;e.preventDefault();
  const L=[...a.closest(".mt-gal").querySelectorAll("a[data-lb]")].map(x=>x.href);let i=+a.dataset.lb;
  const d=document.createElement("div");d.className="lb";d.innerHTML=`<img alt=""><button class="x" type="button">✕</button>${L.length>1?'<button class="p" type="button">‹</button><button class="n" type="button">›</button>':""}<span class="c"></span>`;
  const show=k=>{i=(k+L.length)%L.length;d.querySelector("img").src=L[i];d.querySelector(".c").textContent=`${i+1} / ${L.length}`;};
  d.onclick=ev=>{if(ev.target.closest(".n"))show(i+1);else if(ev.target.closest(".p"))show(i-1);else if(ev.target.closest(".x")||ev.target===d){d.remove();document.body.style.overflow="";}};
  let sx=null;d.addEventListener("touchstart",ev=>sx=ev.touches[0].clientX,{passive:true});d.addEventListener("touchend",ev=>{if(sx==null)return;const dx=ev.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));sx=null;});
  document.body.appendChild(d);document.body.style.overflow="hidden";show(i);
});
addEventListener("hashchange",route);

async function loadDB(){
  if(/[?&]nodb\b/.test(location.search)) return;
  try{const r=await fetch(`${SB_URL}/rest/v1/school_content?select=section,data&published=eq.true&order=position.asc&limit=5000`,{headers:{apikey:SB_KEY}});
    if(!r.ok) return; const rows=await r.json(); if(!rows.length) return;
    const clean=v=>typeof v==="string"?v.replace(/<[^>]*>/g,""):Array.isArray(v)?v.map(clean):v&&typeof v==="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,clean(x)])):v;
    const by={}; rows.forEach(x=>(by[x.section]=by[x.section]||[]).push(clean(x.data)));
    for(const [k,arr] of Object.entries(DB)) if(by[k]) arr.splice(0,arr.length,...by[k]);
    if(by.info&&by.info[0]) INFO={...INFO,...by.info[0]};
    header(); setLang(document.documentElement.lang); route();
  }catch(e){}
}
let L0="dv";try{L0=localStorage.getItem("ks_lang")||"dv"}catch(_){}
header(); setLang(L0); route(); loadDB();
